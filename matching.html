<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マッチング登録 | 社会課題×DX チャレンジ 2026</title>
<meta name="description" content="社会課題×DX チャレンジ 2026 のマッチング登録フォーム。">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ff;--line:rgba(20,16,60,.12);--ink:#14103a;--ink2:#4a4870;--ink3:#7d7aa0;--lime:#c6ff4d;--uv:#6d3bff;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100svh}
.bar{flex:none;display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.bar__logos{display:flex;align-items:center;gap:10px}
.bar__logos img{height:26px;width:auto;display:block}
.bar__logos .sep{width:1px;height:22px;background:var(--line)}
.bar__title{margin-left:6px;font-weight:900;font-size:.98rem;letter-spacing:.02em;white-space:nowrap}
.bar__sub{font-size:.76rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar__back{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--uv);text-decoration:none;padding:7px 12px;border-radius:999px;border:1px solid rgba(109,59,255,.35);white-space:nowrap}
.bar__back:hover{background:rgba(109,59,255,.08)}
.frame{flex:1 1 auto;min-height:0;display:block;width:100%;border:0;background:#fff}
@media(max-width:600px){.bar{gap:10px;padding:0 12px}.bar__logos img{height:22px}.bar__sub{display:none}.bar__title{font-size:.92rem}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar__logos">
    <img src="assets/img/logo_niigata-u.svg" alt="新潟大学">
    <span class="sep" aria-hidden="true"></span>
    <img src="assets/img/logo_create.png" alt="新潟大学 創生学部">
  </div>
  <span class="bar__title">マッチング登録</span>
  <span class="bar__sub">個人・未完成グループ向け ／ 登録締め切り 2026年11月30日(月)</span>
  <a class="bar__back" href="index.html"><span aria-hidden="true">←</span> コンテストトップ</a>
</header>
<iframe class="frame" src="https://script.google.com/macros/s/AKfycbxzsZQ5ShWaDUIJiBnV_wW5Cv6wCl0HKEdcRfA5o6mOHahpaIpxN8VMaVKnXr-RlC2Q/exec" title="マッチング登録フォーム" allow="clipboard-write"></iframe>
</body>
</html>
