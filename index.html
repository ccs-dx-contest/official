<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社会課題×DX チャレンジ 2026</title>
<meta name="description" content="新潟大学 創生学部の学生コンテスト企画「社会課題×DX チャレンジ 2026 〜デジタルの力で未来をつくる〜」の公式サイト(準備中)">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f7f5ff;--ink:#14103a;--ink2:#4a4570;--lime:#c6ff4d;--uv:#6d3bff;--magenta:#ff2fb3;--ice:#19d3ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:32px 16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(60vw 60vw at 100% 0%,rgba(255,47,179,.16),transparent 60%),
 radial-gradient(50vw 50vw at 0% 100%,rgba(25,211,255,.18),transparent 60%),
 radial-gradient(40vw 40vw at 50% 50%,rgba(109,59,255,.10),transparent 60%)}
.card{max-width:640px;width:100%;background:#fff;border:1px solid rgba(20,16,58,.08);border-radius:24px;padding:40px 36px;box-shadow:0 20px 60px rgba(20,16,58,.08)}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--uv);border:1px solid rgba(109,59,255,.35);border-radius:999px;padding:4px 12px;margin-bottom:22px}
h1{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;line-height:1.3;letter-spacing:.01em}
h1 .dx{color:var(--uv)}
.sub{margin-top:6px;font-weight:700;color:var(--ink2)}
.org{margin-top:22px;font-size:.95rem}
.org b{font-weight:900}
.status{margin-top:26px;padding:16px 18px;border-radius:14px;background:var(--lime);font-weight:900;font-size:1rem;color:var(--ink)}
.status small{display:block;font-weight:500;font-size:.85rem;margin-top:4px;color:var(--ink2)}
.contact{margin-top:26px;padding-top:18px;border-top:1px solid rgba(20,16,58,.1);font-size:.9rem;color:var(--ink2)}
.contact .lbl{display:block;font-size:.78rem;letter-spacing:.1em;margin-bottom:2px}
.contact a{color:var(--uv);font-weight:700;text-decoration:none;border-bottom:1px solid rgba(109,59,255,.35)}
@media(max-width:480px){.card{padding:30px 22px;border-radius:18px}}
</style>
</head>
<body>
<main class="card">
  <span class="tag">Niigata University — College of Creative Studies</span>
  <h1>社会課題 <span class="dx">× DX</span> チャレンジ 2026</h1>
  <p class="sub">〜 デジタルの力で未来をつくる 〜</p>
  <p class="org"><b>新潟大学 創生学部</b>(創生学修コース・DX共創コース)の学生を対象とした、DX技術で社会課題に挑むコンテスト企画のサイトです。</p>
  <div class="status">公式サイトは準備中です。<small>参加登録・応募要領などの情報は、公開でき次第このページでお知らせします。</small></div>
  <p class="contact"><span class="lbl">問い合わせ</span><a href="mailto:ccs.contest.official@gmail.com">ccs.contest.official@gmail.com</a></p>
</main>
</body>
</html>
